<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Scanner - ID Card Entry</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background:#faf7f2; margin:0; padding:16px; color:#333; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { text-align:center; color:#4B0082; font-size:20px; }

  .counters { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .counter-card { background:white; border-radius:10px; padding:12px 16px; box-shadow:0 2px 6px rgba(0,0,0,0.08); display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .counter-card b { color:#4B0082; }
  .counter-card .nums { font-weight:bold; font-size:16px; }

  #reader { width:100%; border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .scan-hint { text-align:center; font-size:12px; color:#888; margin-bottom:16px; }

  .manual-entry { background:white; border-radius:10px; padding:14px 16px; box-shadow:0 2px 6px rgba(0,0,0,0.08); margin-bottom:16px; }
  .manual-entry label { display:block; font-size:12px; font-weight:bold; color:#555; margin-bottom:6px; }
  .manual-row { display:flex; gap:8px; }
  .manual-row input { flex:1; padding:10px; border-radius:8px; border:1px solid #ccc; font-size:14px; box-sizing:border-box; }
  .manual-row button { padding:10px 16px; border:none; border-radius:8px; background:#4B0082; color:white; font-weight:bold; cursor:pointer; }

  .result-card { background:white; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:none; }
  .result-card.show { display:block; }
  .result-card h3 { margin-top:0; color:#4B0082; }
  .result-card .row { font-size:14px; margin:6px 0; }
  .result-card .row b { display:inline-block; width:130px; }
  .status-badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:bold; }
  .status-in { background:#e6f9ee; color:#1e8e3e; }
  .status-new { background:#fff4e5; color:#e07b00; }

  button#confirmBtn { width:100%; margin-top:14px; padding:12px; border:none; border-radius:8px; background:#1e8e3e; color:white; font-size:15px; font-weight:bold; cursor:pointer; }
  button#confirmBtn:disabled { background:#ccc; }
  #notFound { display:none; color:#c0392b; text-align:center; font-weight:bold; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin Scanner - Entry Check-in</h1>

  <div class="counters" id="counters"></div>

  <div id="reader"></div>
  <p class="scan-hint">Hold the QR steady, well-lit, filling most of the frame. If it won't scan, use manual entry below.</p>

  <div class="manual-entry">
    <label>Manual Entry Code (backup if camera scan fails)</label>
    <div class="manual-row">
      <input id="manualCode" type="text" placeholder="e.g. ID-AB12CD" autocapitalize="characters">
      <button onclick="submitManualCode()">Lookup</button>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <h3>Student Details</h3>
    <div class="row"><b>Name:</b> <span id="rName"></span></div>
    <div class="row"><b>College:</b> <span id="rCollege"></span></div>
    <div class="row"><b>Course:</b> <span id="rCourse"></span></div>
    <div class="row"><b>Category:</b> <span id="rType"></span></div>
    <div class="row"><b>Status:</b> <span id="rStatus"></span></div>
    <button id="confirmBtn" onclick="confirmEntry()">Confirm Entry</button>
  </div>

  <div id="notFound">QR code not recognized. Try scanning again.</div>
</div>

<script>
  // PASTE your Apps Script /exec URL here
  const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";

  let currentCode = null;
  let scanning = true;

  function loadStats() {
    fetch(SCRIPT_URL + "?action=stats")
      .then(r => r.json())
      .then(stats => {
        const el = document.getElementById('counters');
        el.innerHTML = '';
        Object.keys(stats).forEach(college => {
          const s = stats[college];
          const div = document.createElement('div');
          div.className = 'counter-card';
          div.innerHTML = `<span><b>${college}</b></span>
            <span class="nums">${s.checkedIn} / ${s.total}</span>`;
          el.appendChild(div);
        });
      })
      .catch(err => console.error('Stats error:', err));
  }
  loadStats();
  setInterval(loadStats, 8000);

  function onScanSuccess(decodedText) {
    if (!scanning) return;
    scanning = false;
    lookupCode(decodedText.trim(), () => { scanning = true; });
  }

  function submitManualCode() {
    const input = document.getElementById('manualCode');
    const code = input.value.trim();
    if (!code) return;
    lookupCode(code, () => {});
    input.value = '';
  }

  function lookupCode(code, onDone) {
    currentCode = code;
    fetch(SCRIPT_URL + "?action=lookup&code=" + encodeURIComponent(code))
      .then(r => r.json())
      .then(res => {
        document.getElementById('notFound').style.display = 'none';
        if (!res.found) {
          document.getElementById('notFound').style.display = 'block';
          document.getElementById('resultCard').classList.remove('show');
          setTimeout(onDone, 1500);
          return;
        }
        showResult(res.member);
        onDone();
      })
      .catch(err => {
        console.error('Lookup error:', err);
        setTimeout(onDone, 1500);
      });
  }

  function showResult(member) {
    document.getElementById('rName').innerText = member.name;
    document.getElementById('rCollege').innerText = member.college;
    document.getElementById('rCourse').innerText = member.course;
    document.getElementById('rType').innerText = member.studentType;

    const statusEl = document.getElementById('rStatus');
    const btn = document.getElementById('confirmBtn');
    if (member.alreadyCheckedIn) {
      statusEl.innerHTML = '<span class="status-badge status-in">Already Checked In</span>';
      btn.disabled = true;
      btn.innerText = 'Already Confirmed';
    } else {
      statusEl.innerHTML = '<span class="status-badge status-new">Not Checked In</span>';
      btn.disabled = false;
      btn.innerText = 'Confirm Entry';
    }

    document.getElementById('resultCard').classList.add('show');
  }

  function confirmEntry() {
    if (!currentCode) return;
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.innerText = 'Confirming...';

    fetch(SCRIPT_URL + "?action=checkin&code=" + encodeURIComponent(currentCode))
      .then(r => r.json())
      .then(res => {
        if (res.found) {
          showResult(res.member);
          loadStats();
        }
        setTimeout(() => {
          document.getElementById('resultCard').classList.remove('show');
          currentCode = null;
          scanning = true;
        }, 1800);
      })
      .catch(err => {
        console.error('Checkin error:', err);
        btn.disabled = false;
        btn.innerText = 'Confirm Entry';
      });
  }

  const html5QrCode = new Html5Qrcode("reader", {
    // Use the browser's native BarcodeDetector when available (Chrome/Android/desktop
    // Chrome) - it's noticeably faster and more accurate than the default JS decoder.
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });

  function qrboxFunction(viewfinderWidth, viewfinderHeight) {
    const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
    const size = Math.floor(minEdge * 0.75); // large scan box = easier to fill with the code
    return { width: size, height: size };
  }

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: qrboxFunction,
      aspectRatio: 1.0,
      disableFlip: false
    },
    onScanSuccess,
    (errorMessage) => { /* fires continuously while no code is found - ignore, this is normal */ }
  ).catch(err => {
    console.error("Camera start error:", err);
    alert("Could not start camera: " + err + "\\nTry allowing camera permission, or use manual entry below.");
  });
</script>
</body>
</html>
